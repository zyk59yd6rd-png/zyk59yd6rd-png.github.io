name: Update news

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install feedparser deep-translator

      - run: python update_news.py

      - run: |
          git config user.name "news-bot"
          git config user.email "bot@example.com"
          git add index.html
          git commit -m "Update news" || echo "No changes"
          git push
